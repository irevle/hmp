<app-custom-header title="Produk">
  <!-- Tombol navigasi ke halaman Tambah Produk -->
  <ion-buttons slot="end">
    <ion-button routerLink="/tambah-produk">
      <ion-icon slot="icon-only" name="add-outline"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-custom-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Daftar Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Searchbar Real-time (memanggil method onSearch) -->
  <ion-searchbar placeholder="Cari produk..." [(ngModel)]="keyword" (ionInput)="onSearch($event)" [debounce]="200">
  </ion-searchbar>
<ion-spinner *ngIf="(status$ | async) === 'memuat'"
  aria-label="Memuat produk"></ion-spinner>

<div *ngIf="(status$ | async) === 'gagal'" class="ion-padding">
  <p>Daftar produk gagal dimuat.</p>
  <ion-button (click)="loadProduk()">Coba Lagi</ion-button>
</div>
  <!-- List Produk -->
  <ion-list *ngIf="(status$ | async) === 'siap'" >
    <ion-item *ngFor="let produk of daftarProduk" [routerLink]="['/detail-produk', produk.id]" detail="true">

      <ion-thumbnail slot="start">
        <img [src]="produk.gambar || 'assets/img/no-image.png'" [alt]="produk.nama" />
      </ion-thumbnail>

      <ion-label>
        <h2><strong>{{ produk.nama }}</strong></h2>
        <p>Kategori: {{ produk.kategori }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Pesan jika hasil pencarian kosong -->
  <div *ngIf="(status$ | async) === 'siap' && daftarProduk.length === 0">
    <p>Produk tidak ditemukan.</p>
  </div>
</ion-content>
