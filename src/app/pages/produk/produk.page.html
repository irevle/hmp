<app-custom-header title="Produk"></app-custom-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Daftar Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Searchbar Real-time (memanggil method onSearch) -->
  <ion-searchbar placeholder="Cari produk..." [(ngModel)]="keyword" (ionInput)="onSearch($event)" [debounce]="200">
  </ion-searchbar>

  <!-- List Produk -->
  <ion-list>
    <ion-item *ngFor="let produk of daftarProduk" [routerLink]="['/detail-produk', produk.id]" detail="true">

      <ion-thumbnail slot="start">
        <img [src]="produk.gambar || 'assets/img/no-image.png'" [alt]="produk.nama" />
      </ion-thumbnail>

      <ion-label>
        <h2><strong>{{ produk.nama }}</strong></h2>
        <p>Kategori: {{ produk.kategori }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Pesan jika hasil pencarian kosong -->
  <div *ngIf="daftarProduk.length === 0" class="ion-text-center ion-padding">
    <p>Produk tidak ditemukan.</p>
  </div>
</ion-content>
