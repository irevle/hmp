<app-custom-header title="Profil"></app-custom-header>

<ion-content>
  <!-- identitas -->
  <div class="profil-atas">
    <div class="avatar-lingkaran">
      <ion-icon name="storefront-outline"></ion-icon>
    </div>
    <h2>{{ toko.nama }}</h2>
    <p>Pemilik: {{ toko.pemilik }}</p>
  </div>

  <!-- info toko -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Informasi Toko</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-icon name="location-outline" slot="start"></ion-icon>
          <ion-label>{{ toko.alamat }}</ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="call-outline" slot="start"></ion-icon>
          <ion-label>{{ toko.telepon }}</ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="pricetags-outline" slot="start"></ion-icon>
          <ion-label>{{ toko.kategori }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- info aplikasi -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Tentang Aplikasi</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>{{ aplikasi.nama }}</strong> v{{ aplikasi.versi }}</p>
      <p class="keterangan">{{ aplikasi.keterangan }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
