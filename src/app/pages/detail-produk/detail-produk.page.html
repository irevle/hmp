<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- Tombol kembali ke halaman sebelumnya -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/produk"></ion-back-button>
    </ion-buttons>

    <ion-title>Detail Produk</ion-title>

    <!-- Tombol Edit di kanan atas -->
    <ion-buttons slot="end" *ngIf="produk">
      <ion-button [routerLink]="['/edit-produk', produk.id]">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Tampilkan card jika data produk ditemukan -->
  <ion-card *ngIf="produk">

    <!-- PERUBAHAN: fallback menggunakan gambar lokal -->
    <img [src]="produk.gambar ? produk.gambar : 'assets/img/no-image.png'" [alt]="produk.nama" />

    <ion-card-header>
      <ion-card-subtitle>
        {{ produk.kategori }}
      </ion-card-subtitle>

      <ion-card-title>
        {{ produk.nama }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-list lines="none">

        <ion-item>
          <ion-label>
            <h3>Stok Tersedia</h3>
            <p>{{ produk.stok | number }} unit</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Harga Beli</h3>
            <p>Rp{{ produk.hargaBeli | number }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Harga Jual</h3>
            <p>
              <strong>
                Rp{{ produk.hargaJual | number }}
              </strong>
            </p>
          </ion-label>
        </ion-item>

      </ion-list>

      <!-- Tombol yang memicu fungsi -->
      <ion-button expand="block" class="ion-margin-top" [disabled]="produk.stok === 0" (click)="tambahKeKeranjang()">
        <ion-icon slot="start" name="cart-outline">
        </ion-icon>

        {{ produk.stok === 0 ? 'Stok Habis' : 'Tambah ke Keranjang' }}
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Tampilan jika produk tidak ditemukan/ID salah -->
  <div *ngIf="!produk" class="ion-text-center ion-padding">
    <p>Produk tidak ditemukan.</p>
  </div>

</ion-content>
