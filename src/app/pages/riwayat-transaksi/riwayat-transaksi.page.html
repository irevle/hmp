<app-custom-header title="Riwayat Transaksi"></app-custom-header>

<ion-content>
  <!-- Loading state -->
  <div class="ion-text-center ion-padding" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Memuat riwayat...</p>
  </div>

  <!-- Error state -->
  <div class="ion-text-center ion-padding" *ngIf="isError && !isLoading">
    <ion-icon name="alert-circle-outline" size="large" color="danger"></ion-icon>
    <p>Gagal memuat riwayat transaksi.</p>
    <ion-button (click)="load()">Coba Lagi</ion-button>
  </div>
  
  <!-- kosong -->
  <app-empty-state *ngIf="daftarTransaksi.length === 0" icon="receipt-outline" pesan="Belum ada transaksi">
  </app-empty-state>

  <!-- Daftar transaksi -->
  <ion-list lines="full" *ngIf="!isLoading && !isError && daftarTransaksi.length > 0">
    <ion-item *ngFor="let t of daftarTransaksi" button (click)="lihatDetail(t)">
      <ion-icon name="receipt-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>Transaksi #{{ t.id }}</h2>
        <p>{{ t.tanggal | date:'d MMM yyyy, HH:mm' }}</p>
        <p>{{ t.pelanggan?.nama }} · {{ jumlahItem(t) }} barang</p>
      </ion-label>
      <ion-badge slot="end" color="success">
        Rp{{ t.total | number }}
      </ion-badge>
      <ion-icon name="chevron-forward" slot="end" color="medium"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
